[workspace]
members = [
    "crates/auditor",
    "crates/jail",
    "crates/redactor",
]
resolver = "2"

[package]
name = "agentguard"
version = "0.1.0"
edition = "2024"
description = "Runtime security harness for AI agent tool execution over MCP"
license = "MIT"

[[bin]]
name = "agentguard"
path = "src/main.rs"

[dependencies]
agentguard-auditor = { path = "crates/auditor" }
agentguard-jail = { path = "crates/jail" }
agentguard-redactor = { path = "crates/redactor" }
axum = "0.8"
clap = { version = "4", features = ["derive"] }
futures-util = "0.3"
reqwest = { version = "0.12", features = ["json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tower = "0.5"

[workspace.dependencies]
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
